[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthrag-auth-research"
version = "0.1.0"
description = "Risk-aware pre-retrieval authorization research artifact for healthcare RAG systems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
experiment = [
  "torch>=2.2",
  "transformers>=4.45,<5",
  "safetensors>=0.4",
  "accelerate>=0.30",
]
test = ["pytest>=8.0", "hypothesis>=6.112"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
