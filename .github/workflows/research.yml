name: Research Reproduction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and experiment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[experiment,test]'

      - name: Unit and architecture tests
        run: pytest -q

      - name: Prepare official Synthea FHIR R4 dataset
        run: |
          python -m healthrag.data
          python -m healthrag.prompts

      - name: Run empirical LLM experiment
        run: |
          python -m healthrag.experiment --model HuggingFaceTB/SmolLM2-360M-Instruct

      - name: Analyze empirical results
        run: python -m healthrag.analysis

      - name: Download and validate NuSMV 2.7.1
        run: |
          curl -fL --retry 3 -o /tmp/nusmv.tar.xz https://nusmv.fbk.eu/distrib/2.7.1/NuSMV-2.7.1-linux64.tar.xz
          mkdir -p /tmp/nusmv
          tar -xf /tmp/nusmv.tar.xz -C /tmp/nusmv
          NUSMV=$(find /tmp/nusmv -type f -name NuSMV | head -1)
          chmod +x "$NUSMV"
          NUSMV_ROOT=$(dirname "$(dirname "$NUSMV")")
          NUSMV_LIB="$NUSMV_ROOT/lib"
          export LD_LIBRARY_PATH="$NUSMV_LIB:${LD_LIBRARY_PATH:-}"
          echo "NUSMV=$NUSMV" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "NuSMV executable: $NUSMV"
          echo "Bundled library directory: $NUSMV_LIB"
          ldd "$NUSMV" || true
          "$NUSMV" -h >/tmp/nusmv_help.txt 2>&1 || { cat /tmp/nusmv_help.txt; exit 1; }
          head -20 /tmp/nusmv_help.txt || true

      - name: Formal verification
        run: python -m healthrag.formal --nusmv "$NUSMV"

      - name: Collect reproducibility metadata
        if: always()
        run: |
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import torch, transformers, sklearn, scipy, pandas
          meta = {
              "python": sys.version,
              "platform": platform.platform(),
              "torch": torch.__version__,
              "transformers": transformers.__version__,
              "sklearn": sklearn.__version__,
              "scipy": scipy.__version__,
              "pandas": pandas.__version__,
              "model": "HuggingFaceTB/SmolLM2-360M-Instruct",
              "prompt_count": 72,
              "architectures": ["prompt_only", "pre_retrieval_acl", "risk_aware"],
          }
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/reproducibility.json").write_text(json.dumps(meta, indent=2))
          PY

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthrag-research-artifacts
          path: |
            artifacts/
            data/processed/authorization.json
            data/processed/protected_pool.json
            data/processed/test_cases.json
          retention-days: 30
