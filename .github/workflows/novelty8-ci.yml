name: Novelty-8 Branch Validation

on:
  push:
    branches: [novelty-8-structural-heuristic]
  workflow_dispatch:

concurrency:
  group: novelty8-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run full unit and property suite
        run: pytest -q
      - name: Compile all modules
        run: python -m compileall -q src tests
